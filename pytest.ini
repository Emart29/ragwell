[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --asyncio-mode=strict --timeout=30 -m "not slow"
norecursedirs = venv .venv node_modules frontend data fixtures tests/fixtures
# Explicitly ignore fixtures directory for collection
filterwarnings =
    ignore::DeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests that require external APIs
